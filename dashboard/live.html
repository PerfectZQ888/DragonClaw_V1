<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦞 DragonClaw - 实时监控 V1.0.0</title>
    <meta name="version" content="V1.0.0">
    <style>
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #131a4a;
            --bg-card: #1a1f4e;
            --accent: #f97316;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            --info: #3b82f6;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --border: #2d3a8c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'SF Mono', monospace; background: var(--bg-primary); color: var(--text); min-height: 100vh; }

        .header {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-primary));
            border-bottom: 1px solid var(--border);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { display: flex; align-items: center; gap: 15px; }
        .logo-icon { font-size: 2rem; animation: glow 2s infinite; }
        @keyframes glow { 0%,100% { text-shadow: 0 0 20px rgba(249,115,22,0.5); } 50% { text-shadow: 0 0 40px rgba(249,115,22,0.8); } }
        .logo h1 { font-size: 1.5rem; background: linear-gradient(90deg, var(--accent), #fbbf24); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo span { font-size: 0.8rem; color: var(--text-muted); }

        .live-indicator {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 16px; background: var(--bg-card); border-radius: 20px; font-size: 0.85rem;
        }
        .live-dot { width: 10px; height: 10px; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

        .home-link { padding: 8px 16px; background: var(--bg-card); border-radius: 8px; color: var(--text); text-decoration: none; font-size: 0.9rem; }
        .home-link:hover { background: var(--accent); }

        .stats-bar {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px;
            padding: 20px 30px; background: var(--bg-secondary);
        }
        .stat-card {
            background: var(--bg-card); border-radius: 12px; padding: 15px; text-align: center;
            border: 1px solid var(--border); transition: all 0.3s;
        }
        .stat-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .stat-value { font-size: 2rem; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-top: 5px; }

        .main { padding: 20px 30px; }

        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab {
            padding: 10px 20px; background: var(--bg-card); border: 1px solid var(--border);
            color: var(--text-muted); cursor: pointer; font-size: 0.9rem; border-radius: 8px;
            transition: all 0.3s; font-family: inherit;
        }
        .tab:hover { border-color: var(--accent); color: var(--text); }
        .tab.active { background: var(--accent); color: white; border-color: var(--accent); }
        .section { display: none; }
        .section.active { display: block; }

        .agents-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
        }
        .agent-card {
            background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border);
            overflow: hidden; transition: all 0.3s;
        }
        .agent-card:hover { border-color: var(--accent); transform: translateY(-5px); }

        .agent-header {
            padding: 15px 20px; background: var(--bg-secondary);
            display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border);
        }
        .agent-avatar {
            width: 50px; height: 50px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem; background: var(--bg-primary);
        }
        .agent-info h3 { font-size: 1rem; }
        .agent-info .role { font-size: 0.8rem; color: var(--text-muted); }

        .agent-body { padding: 15px 20px; }
        .agent-status { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; animation: pulse 2s infinite; }
        .status-online { background: var(--success); }
        .status-busy { background: var(--warning); animation: pulse 1s infinite; }
        .status-offline { background: var(--text-muted); animation: none; }

        .agent-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .metric { background: var(--bg-primary); padding: 8px; border-radius: 8px; text-align: center; }
        .metric .value { font-size: 1.2rem; font-weight: 600; color: var(--accent); }
        .metric .label { font-size: 0.65rem; color: var(--text-muted); }

        .task-panel {
            background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border); overflow: hidden;
        }
        .task-header {
            padding: 15px 20px; background: var(--bg-secondary);
            border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
        }
        .task-header h3 { font-size: 1rem; }
        .task-stats { display: flex; gap: 15px; }
        .task-stat { padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; }
        .task-stat.pending { background: rgba(100,116,139,0.2); color: var(--text-muted); }
        .task-stat.running { background: rgba(234,179,8,0.2); color: var(--warning); }
        .task-stat.done { background: rgba(34,197,94,0.2); color: var(--success); }

        .task-list { max-height: 400px; overflow-y: auto; }
        .task-item {
            padding: 12px 20px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 15px; transition: background 0.2s;
        }
        .task-item:hover { background: var(--bg-secondary); }
        .task-item:last-child { border-bottom: none; }
        .task-priority { width: 4px; height: 40px; border-radius: 4px; }
        .priority-high { background: var(--danger); }
        .priority-medium { background: var(--warning); }
        .priority-low { background: var(--success); }

        .task-content { flex: 1; min-width: 0; }
        .task-title { font-size: 0.95rem; margin-bottom: 4px; word-break: break-word; white-space: normal; }
        .task-meta { font-size: 0.75rem; color: var(--text-muted); }

        .task-status { padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; }
        .status-pending { background: rgba(100,116,139,0.2); color: var(--text-muted); }
        .status-progress { background: rgba(59,130,246,0.2); color: var(--info); }
        .status-done { background: rgba(34,197,94,0.2); color: var(--success); }

        .summary-panel { background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
        .summary-header { padding: 15px 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); }
        .summary-header h3 { font-size: 1rem; color: var(--accent); }
        .summary-content { padding: 20px; }
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .summary-item { background: var(--bg-primary); border-radius: 12px; padding: 15px; }
        .summary-item h4 { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
        .summary-item .value { font-size: 1.5rem; font-weight: 700; color: var(--accent); }

        .summary-chart { background: var(--bg-primary); border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .chart-title { font-size: 0.9rem; margin-bottom: 15px; color: var(--text-muted); }
        .chart-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .chart-label { min-width: 80px; font-size: 0.8rem; }
        .chart-bar-container { flex: 1; height: 20px; background: var(--bg-secondary); border-radius: 4px; overflow: hidden; }
        .chart-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
        .bar-research { background: var(--info); }
        .bar-creative { background: #a855f7; }
        .bar-dev { background: var(--success); }
        .bar-security { background: var(--danger); }

        .recent-completed { background: var(--bg-primary); border-radius: 12px; padding: 15px; }
        .completed-title { font-size: 0.9rem; margin-bottom: 15px; color: var(--text-muted); }
        .completed-item {
            display: flex; align-items: center; gap: 10px; padding: 10px;
            background: var(--bg-secondary); border-radius: 8px; margin-bottom: 8px;
        }
        .completed-icon { font-size: 1.2rem; }
        .completed-info { flex: 1; }
        .completed-task { font-size: 0.85rem; word-break: break-all; white-space: normal; }
        .completed-time { font-size: 0.7rem; color: var(--text-muted); }

        .activity-list { max-height: 400px; overflow-y: auto; }
        .activity-item {
            padding: 12px 20px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 15px; animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .activity-time { font-size: 0.8rem; color: var(--text-muted); min-width: 70px; }
        .activity-agent { padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .agent-main { background: rgba(249,115,22,0.2); color: var(--accent); }
        .agent-research { background: rgba(59,130,246,0.2); color: #60a5fa; }
        .agent-creative { background: rgba(168,85,247,0.2); color: #c084fc; }
        .agent-dev { background: rgba(34,197,94,0.2); color: #4ade80; }
        .agent-security { background: rgba(239,68,68,0.2); color: #f87171; }
        .agent-skill { background: rgba(99,102,241,0.2); color: #a5b4fc; }
        .activity-content { flex: 1; font-size: 0.9rem; word-break: break-all; white-space: normal; }

        .footer { text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.8rem; border-top: 1px solid var(--border); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
        .loading { text-align: center; padding: 40px; color: var(--text-muted); }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <span class="logo-icon">🦞</span>
            <div>
                <h1>DragonClaw</h1>
                <span>实时监控</span>
            </div>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <a href="index.html" class="home-link">← 返回首页</a>
            <div class="live-indicator">
                <span class="live-dot" id="live-dot" style="background: #ef4444;"></span>
                <span id="update-status">连接中...</span>
            </div>
        </div>
    </header>

    <div class="stats-bar">
        <div class="stat-card">
            <div class="stat-value" id="stat-agents">-</div>
            <div class="stat-label">团队成员</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-online">-</div>
            <div class="stat-label">在线</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-running">-</div>
            <div class="stat-label">进行中</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-completed">-</div>
            <div class="stat-label">已完成</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-skills">-</div>
            <div class="stat-label">Skills就绪</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-messages">-</div>
            <div class="stat-label">今日消息</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-connections">-</div>
            <div class="stat-label">连接状态</div>
        </div>
    </div>

    <div style="padding: 0 30px; margin-top: -5px;">
        <div style="background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); padding: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="font-size: 0.95rem;">🖥️ 系统监控</h3>
                <span style="font-size: 0.7rem; color: var(--text-muted);" id="sys-update">-</span>
            </div>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 15px;">
                <div style="text-align: center; padding: 12px; background: var(--bg-primary); border-radius: 10px;">
                    <div style="font-size: 1.4rem; font-weight: 700; color: var(--accent);" id="sys-cpu">-</div>
                    <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 5px;">CPU</div>
                    <div style="height: 6px; background: var(--bg-secondary); border-radius: 3px; overflow: hidden; margin-top: 6px;">
                        <div id="sys-cpu-bar" style="height: 100%; background: var(--success); border-radius: 3px; width: 0%; transition: width 0.5s;"></div>
                    </div>
                </div>
                <div style="text-align: center; padding: 12px; background: var(--bg-primary); border-radius: 10px;">
                    <div style="font-size: 1.4rem; font-weight: 700; color: var(--accent);" id="sys-mem">-</div>
                    <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 5px;">内存</div>
                    <div style="height: 6px; background: var(--bg-secondary); border-radius: 3px; overflow: hidden; margin-top: 6px;">
                        <div id="sys-mem-bar" style="height: 100%; background: var(--success); border-radius: 3px; width: 0%; transition: width 0.5s;"></div>
                    </div>
                </div>
                <div style="text-align: center; padding: 12px; background: var(--bg-primary); border-radius: 10px;">
                    <div style="font-size: 1.4rem; font-weight: 700; color: var(--accent);" id="sys-disk">-</div>
                    <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 5px;">系统盘 /</div>
                    <div style="height: 6px; background: var(--bg-secondary); border-radius: 3px; overflow: hidden; margin-top: 6px;">
                        <div id="sys-disk-bar" style="height: 100%; background: var(--success); border-radius: 3px; width: 0%; transition: width 0.5s;"></div>
                    </div>
                </div>
                <div id="extra-disks-live" style="display: contents;"></div>
            </div>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; font-size: 0.8rem;">
                <div style="background: var(--bg-primary); border-radius: 8px; padding: 10px; text-align: center;">
                    <div style="color: var(--text-muted); font-size: 0.7rem;">负载均值</div>
                    <div style="font-weight: 600; margin-top: 3px;" id="sys-load">-</div>
                </div>
                <div style="background: var(--bg-primary); border-radius: 8px; padding: 10px; text-align: center;">
                    <div style="color: var(--text-muted); font-size: 0.7rem;">可用内存</div>
                    <div style="font-weight: 600; margin-top: 3px;" id="sys-mem-free">-</div>
                </div>
                <div style="background: var(--bg-primary); border-radius: 8px; padding: 10px; text-align: center;">
                    <div style="color: var(--text-muted); font-size: 0.7rem;">可用磁盘</div>
                    <div style="font-weight: 600; margin-top: 3px;" id="sys-disk-free">-</div>
                </div>
                <div style="background: var(--bg-primary); border-radius: 8px; padding: 10px; text-align: center;">
                    <div style="color: var(--text-muted); font-size: 0.7rem;">运行时长</div>
                    <div style="font-weight: 600; margin-top: 3px;" id="sys-uptime">-</div>
                </div>
            </div>
        </div>
    </div>

    <main class="main">
        <div class="nav-tabs">
            <button class="tab active" onclick="showSection('overview', this)">📊 概览</button>
            <button class="tab" onclick="showSection('tasks', this)">📋 任务</button>
            <button class="tab" onclick="showSection('activity', this)">📡 活动</button>
            <button class="tab" onclick="showSection('summary', this)">📈 报告</button>
            <div style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
                <div id="auth-container"></div>
            </div>
        </div>

        <section id="overview" class="section active">
            <div class="agents-grid" id="agents-grid"></div>

            <!-- 最近完成的任务 - 添加到概览页面 -->
            <div class="recent-completed" style="margin-top: 20px;">
                <div class="completed-title">🎉 最近完成的任务</div>
                <div class="recent-completed-list"></div>
            </div>
        </section>

        <section id="tasks" class="section">
            <div class="task-panel">
                <div class="task-header">
                    <h3>📋 任务列表</h3>
                    <div class="task-stats">
                        <span class="task-stat pending" id="task-pending">待处理: 0</span>
                        <span class="task-stat running" id="task-running">进行中: 0</span>
                        <span class="task-stat done" id="task-done">已完成: 0</span>
                    </div>
                </div>
                <div class="task-list" id="task-list"></div>
            </div>
        </section>

        <section id="activity" class="section">
            <div class="task-panel">
                <div class="task-header">
                    <h3>📡 实时活动</h3>
                    <span id="activity-count">0 条记录</span>
                </div>
                <div class="activity-list" id="activity-list"></div>
            </div>
        </section>

        <section id="summary" class="section">
            <div class="summary-panel">
                <div class="summary-header"><h3>📈 任务汇总报告</h3></div>
                <div class="summary-content">
                    <div class="summary-grid">
                        <div class="summary-item">
                            <h4>今日任务</h4>
                            <div class="value" id="summary-today">0</div>
                        </div>
                        <div class="summary-item">
                            <h4>进行中</h4>
                            <div class="value" id="summary-progress">0</div>
                        </div>
                        <div class="summary-item">
                            <h4>完成率</h4>
                            <div class="value" id="summary-rate">100%</div>
                        </div>
                        <div class="summary-item">
                            <h4>平均耗时</h4>
                            <div class="value" id="summary-time">0s</div>
                        </div>
                    </div>
                    <div id="usage-summary" style="padding: 8px 0; text-align: center;"></div>
                    <div class="summary-chart">
                        <div class="chart-title">各 Agent 任务分布</div>
                        <div id="agent-distribution"></div>
                    </div>
                    <div class="recent-completed">
                        <div class="completed-title">🎉 最近完成的任务</div>
                        <div class="recent-completed-list"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        🦞 DragonClaw | 最后更新: <span id="last-update">-</span>
    </footer>

    <script src="js/common.js"></script>
    <script src="js/live.js"></script>
</body>
</html>
